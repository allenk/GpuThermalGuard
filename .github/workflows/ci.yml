name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    # windows-2025 moved to the VS 2026 image in June 2026. This project is
    # deliberately pinned to the VS 2022/v143 toolchain.
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate public surface
        shell: pwsh
        run: ./tools/check-public-surface.ps1

      - name: Configure (Visual Studio 2022)
        shell: pwsh
        run: cmake -S . -B out/build/ci -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build out/build/ci --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir out/build/ci -C Release --output-on-failure

      - name: Verify outputs
        shell: pwsh
        run: |
          if (-not (Test-Path out/build/ci/Release/GpuThermalGuard.exe)) { throw 'Main executable missing.' }
          if (-not (Test-Path out/build/ci/Release/GpuThermalGuardProbe.exe)) { throw 'Probe executable missing.' }
