name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release-windows-x64:
    # windows-2025 moved to the VS 2026 image in June 2026. Keep release
    # binaries reproducible with the project's VS 2022/v143 baseline.
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Validate public surface
        shell: pwsh
        run: ./tools/check-public-surface.ps1

      - name: Validate tag, version resources, and changelog
        shell: pwsh
        run: ./tools/prepare-release.ps1 -Tag '${{ github.ref_name }}' -ValidateOnly

      # The overlay's Dear ImGui comes from vcpkg in manifest mode (vcpkg.json).
      # The runner's vcpkg clone may predate the manifest's builtin-baseline.
      - name: Prepare vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $root cat-file -e "$baseline^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C $root fetch --quiet origin
            git -C $root cat-file -e "$baseline^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "vcpkg baseline $baseline is not available." }
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Visual Studio 2022)
        shell: pwsh
        run: >-
          cmake -S . -B out/build/release-ci -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: cmake --build out/build/release-ci --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir out/build/release-ci -C Release --output-on-failure

      - name: Authenticode sign and verify when configured
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Release signing is only partially configured. Set both signing secrets or remove both.'
          }
          if (-not $hasCertificate) {
            'signed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning 'No Authenticode certificate is configured. The release notes will say the binaries are unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signTool) { throw 'signtool.exe was not found on the runner.' }
            foreach ($file in @(
              'out/build/release-ci/Release/GpuThermalGuard.exe',
              'out/build/release-ci/Release/gtg_overlay.dll'
            )) {
              & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $file
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file." }
              & $signTool.FullName verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $file." }
            }
            'signed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare packages, checksums, and release notes
        shell: pwsh
        run: |
          $parameters = @{ Tag = '${{ github.ref_name }}' }
          if ('${{ steps.signing.outputs.signed }}' -ne 'true') {
            $parameters.Unsigned = $true
          }
          ./tools/prepare-release.ps1 @parameters

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.Substring(1)
          # Recommended package first: GitHub lists assets in upload order.
          $arguments = @(
            'release', 'create', $tag,
            '--verify-tag',
            '--title', "GpuThermalGuard $tag",
            '--notes-file', 'dist/release-notes.md',
            "dist/GpuThermalGuard-$version-windows-x64.zip",
            "dist/GpuThermalGuard-$version-no-overlay-windows-x64.zip",
            'dist/SHA256SUMS.txt'
          )
          # Signing state is in the notes; only a pre-release version is a prerelease.
          if ($tag.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
